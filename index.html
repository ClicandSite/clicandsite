<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Site en préparation</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root{--bg:#F5F6FA;--ink:#12162B;--muted:#5C627A}
@media (prefers-color-scheme:dark){:root{--bg:#0D1020;--ink:#EEF0F8;--muted:#9AA1BC;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;padding:0 max(16px,env(safe-area-inset-left,0px))}
main{max-width:520px;text-align:center}
h1{font-size:1.8rem;margin:0 0 10px}
p{color:var(--muted);margin:0}
</style>
</head>
<body><main><h1>Site en préparation</h1><p>Notre site revient très bientôt. Contact : <span style="user-select:all">contact@clicandsite.fr</span></p></main></body>
</html>
